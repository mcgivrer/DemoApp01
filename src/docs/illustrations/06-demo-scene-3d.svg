<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">DemoScene 3D Layer Composition</text>
    
    <!-- 3D Perspective Grid -->
    <path d="M 100 200 L 700 200 L 650 500 L 150 500 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" opacity="0.3"/>
    
    <!-- 3D Axes -->
    <path d="M 100 200 L 700 200" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="710" y="195" font-size="12" fill="#f44336">X</text>
    
    <path d="M 100 200 L 150 500" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="160" y="510" font-size="12" fill="#4caf50">Y</text>
    
    <path d="M 700 200 L 650 500" stroke="#2196f3" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="660" y="510" font-size="12" fill="#2196f3">Z (Depth)</text>
    
    <!-- 3D Layers as stacked planes -->
    
    <!-- BACKGROUND Layer (farthest) -->
    <path d="M 200 300 L 600 300 L 550 450 L 250 450 Z" fill="#b3e5fc" stroke="#03a9f4" stroke-width="2" opacity="0.8"/>
    <text x="400" y="375" text-anchor="middle" font-weight="bold" fill="#01579b">BACKGROUND</text>
    <text x="400" y="395" text-anchor="middle" font-size="11" fill="#01579b">Sky, Mountains</text>
    
    <!-- MIDGROUND Layer -->
    <path d="M 250 250 L 550 250 L 500 375 L 300 375 Z" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" opacity="0.85"/>
    <text x="400" y="312" text-anchor="middle" font-weight="bold" fill="#2e7d32">MIDGROUND</text>
    <text x="400" y="332" text-anchor="middle" font-size="11" fill="#2e7d32">Player, Enemies</text>
    
    <!-- FOREGROUND Layer -->
    <path d="M 300 200 L 500 200 L 450 300 L 350 300 Z" fill="#a5d6a7" stroke="#66bb6a" stroke-width="2" opacity="0.9"/>
    <text x="400" y="250" text-anchor="middle" font-weight="bold" fill="#388e3c">FOREGROUND</text>
    <text x="400" y="270" text-anchor="middle" font-size="11" fill="#388e3c">Close Objects</text>
    
    <!-- UI Layer (closest to viewer) -->
    <path d="M 350 150 L 450 150 L 425 225 L 375 225 Z" fill="#ffebee" stroke="#f44336" stroke-width="2" opacity="0.95"/>
    <text x="400" y="187" text-anchor="middle" font-weight="bold" fill="#c62828">UI</text>
    <text x="400" y="207" text-anchor="middle" font-size="11" fill="#c62828">HUD, Score</text>
    
    <!-- 3D Camera -->
    <g transform="translate(650, 250)">
      <path d="M 0 0 L 20 10 L 0 20 L -20 10 Z" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="35" text-anchor="middle" font-weight="bold" fill="#e65100">Camera</text>
      <path d="M 0 40 L 0 80" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="0" y="100" text-anchor="middle" font-size="11" fill="#e65100">View</text>
    </g>
    
    <!-- 3D Sample Objects -->
    
    <!-- BACKGROUND objects -->
    <g transform="translate(250, 350)">
      <ellipse cx="0" cy="0" rx="25" ry="15" fill="#81d4fa" opacity="0.7"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Cloud</text>
    </g>
    
    <g transform="translate(450, 370)">
      <polygon points="-20,0 0,-15 20,0 0,10" fill="#80cbc4" opacity="0.7"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Mountain</text>
    </g>
    
    <!-- MIDGROUND objects -->
    <g transform="translate(300, 300)">
      <rect x="-12" y="-12" width="24" height="24" fill="#4caf50" opacity="0.8"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Player</text>
    </g>
    
    <g transform="translate(500, 320)">
      <rect x="-10" y="-10" width="20" height="20" fill="#f44336" opacity="0.8"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Enemy</text>
    </g>
    
    <!-- FOREGROUND objects -->
    <g transform="translate(350, 250)">
      <rect x="-17" y="-17" width="34" height="34" fill="#8d6e63" opacity="0.85"/>
      <text x="0" y="25" text-anchor="middle" font-size="10">Rock</text>
    </g>
    
    <g transform="translate(450, 260)">
      <polygon points="-15,0 0,-20 15,0 0,15" fill="#795548" opacity="0.85"/>
      <text x="0" y="25" text-anchor="middle" font-size="10">Tree</text>
    </g>
    
    <!-- UI elements -->
    <g transform="translate(400, 180)">
      <rect x="-40" y="-8" width="80" height="16" fill="#ef9a9a" opacity="0.9" rx="3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10">Health: 100%</text>
    </g>
    
    <g transform="translate(400, 200)">
      <rect x="-30" y="-6" width="60" height="12" fill="#ffe0b2" opacity="0.9" rx="3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10">Score: 1200</text>
    </g>
    
    <!-- Legend -->
    <rect x="50" y="50" width="200" height="80" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="150" y="70" text-anchor="middle" font-weight="bold">3D Layer View</text>
    <text x="150" y="90" text-anchor="middle" font-size="11">Isometric Perspective</text>
    <text x="150" y="110" text-anchor="middle" font-size="11">Z-axis = Depth</text>
    
    <!-- Depth Scale -->
    <path d="M 700 150 L 700 450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="710" y="145" font-size="12" font-weight="bold">Depth (Z)</text>
    <text x="710" y="165" font-size="10">Near (Camera)</text>
    <text x="710" y="460" font-size="10">Far</text>
    
    <!-- Layer Labels on side -->
    <text x="730" y="200" font-size="11" fill="#c62828">UI Layer</text>
    <text x="730" y="280" font-size="11" fill="#388e3c">FOREGROUND</text>
    <text x="730" y="360" font-size="11" fill="#2e7d32">MIDGROUND</text>
    <text x="730" y="440" font-size="11" fill="#01579b">BACKGROUND</text>
  </g>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Application Architecture</text>
    
    <!-- App Class -->
    <rect x="350" y="50" width="100" height="60" rx="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="400" y="80" text-anchor="middle" font-weight="bold">App</text>
    <text x="400" y="100" text-anchor="middle" font-size="12">Main Coordinator</text>
    
    <!-- Services -->
    <rect x="200" y="150" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="260" y="175" text-anchor="middle" font-weight="bold">PhysicsEngine</text>
    
    <rect x="350" y="150" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="410" y="175" text-anchor="middle" font-weight="bold">Renderer</text>
    
    <rect x="500" y="150" width="120" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="560" y="175" text-anchor="middle" font-weight="bold">InputHandler</text>
    
    <!-- Scene -->
    <rect x="350" y="250" width="100" height="50" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="400" y="275" text-anchor="middle" font-weight="bold">Scene</text>
    
    <!-- Entities -->
    <rect x="250" y="350" width="100" height="50" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="300" y="375" text-anchor="middle" font-weight="bold">Entity</text>
    
    <rect x="450" y="350" width="100" height="50" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="500" y="375" text-anchor="middle" font-weight="bold">GameObject</text>
    
    <!-- Arrows -->
    <path d="M 400 110 L 400 150" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 260 175 L 260 150" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 560 175 L 560 150" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 400 200 L 400 250" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 330 325 L 300 350" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 530 325 L 500 350" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Legend -->
    <rect x="50" y="450" width="150" height="100" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="125" y="470" text-anchor="middle" font-weight="bold">Legend</text>
    <circle cx="70" cy="490" r="5" fill="#2196f3"/>
    <text x="100" y="495">Main Class</text>
    <circle cx="70" cy="510" r="5" fill="#4caf50"/>
    <text x="100" y="515">Services</text>
    <circle cx="70" cy="530" r="5" fill="#ff9800"/>
    <text x="100" y="535">Scene</text>
    <circle cx="70" cy="550" r="5" fill="#9c27b0"/>
    <text x="100" y="555">Entities</text>
  </g>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">DemoScene 3D Perspective View</text>
    <text x="400" y="50" text-anchor="middle" font-size="14">Through the Camera Lens</text>
    
    <!-- Grid background (tile-based) -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="100" y="200" width="600" height="300" fill="url(#grid)" opacity="0.3"/>
    
    <!-- Camera position (viewer's perspective) -->
    <g transform="translate(400, 500)">
      <path d="M -30 0 L 30 0 L 20 -20 L -20 -20 Z" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="30" text-anchor="middle" font-weight="bold" fill="#e65100">You (Camera)</text>
      <path d="M 0 40 L 0 100" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="0" y="120" text-anchor="middle" font-size="11" fill="#e65100">View Direction</text>
    </g>
    
    <!-- 3D Layers from camera perspective (near to far) -->
    
    <!-- FOREGROUND Layer (closest to camera) -->
    <path d="M 150 350 L 650 350 L 600 400 L 200 400 Z" fill="#a5d6a7" stroke="#66bb6a" stroke-width="2" opacity="0.9"/>
    <text x="400" y="375" text-anchor="middle" font-weight="bold" fill="#388e3c">FOREGROUND</text>
    <text x="400" y="395" text-anchor="middle" font-size="11" fill="#388e3c">Platforms, Close Objects</text>
    
    <!-- MIDGROUND Layer -->
    <path d="M 200 300 L 600 300 L 550 350 L 250 350 Z" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" opacity="0.85"/>
    <text x="400" y="325" text-anchor="middle" font-weight="bold" fill="#2e7d32">MIDGROUND</text>
    <text x="400" y="345" text-anchor="middle" font-size="11" fill="#2e7d32">Player, Enemies, Decor</text>
    
    <!-- BACKGROUND Layer (farthest) -->
    <path d="M 250 250 L 550 250 L 500 300 L 300 300 Z" fill="#b3e5fc" stroke="#03a9f4" stroke-width="2" opacity="0.8"/>
    <text x="400" y="275" text-anchor="middle" font-weight="bold" fill="#01579b">BACKGROUND</text>
    <text x="400" y="295" text-anchor="middle" font-size="11" fill="#01579b">Sky, Clouds, Mountains</text>
    
    <!-- UI Layer (screen-space, not affected by depth) -->
    <rect x="300" y="100" width="200" height="50" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="2" opacity="0.95"/>
    <text x="400" y="125" text-anchor="middle" font-weight="bold" fill="#c62828">UI Layer</text>
    <text x="400" y="145" text-anchor="middle" font-size="11" fill="#c62828">HUD, Score (Fixed)</text>
    
    <!-- 3D Objects in layers -->
    
    <!-- FOREGROUND objects (platforms, close obstacles) -->
    <g transform="translate(300, 370)">
      <rect x="-50" y="-10" width="100" height="20" fill="#8d6e63" opacity="0.85" rx="2"/>
      <text x="0" y="15" text-anchor="middle" font-size="10">Platform</text>
    </g>
    
    <g transform="translate(500, 380)">
      <rect x="-25" y="-25" width="50" height="50" fill="#795548" opacity="0.85" rx="5"/>
      <text x="0" y="35" text-anchor="middle" font-size="10">Rock</text>
    </g>
    
    <!-- MIDGROUND objects (player, enemies, decor) -->
    <g transform="translate(350, 320)">
      <rect x="-15" y="-20" width="30" height="40" fill="#4caf50" opacity="0.8" rx="5"/>
      <circle cx="0" cy="-25" r="10" fill="#ffeb3b" opacity="0.8"/>
      <text x="0" y="30" text-anchor="middle" font-size="10">Player</text>
    </g>
    
    <g transform="translate(450, 340)">
      <rect x="-12" y="-12" width="24" height="24" fill="#f44336" opacity="0.8" rx="2"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Enemy</text>
    </g>
    
    <g transform="translate(550, 330)">
      <polygon points="-15,-10 0,-20 15,-10 10,0 -10,0" fill="#8bc34a" opacity="0.8"/>
      <text x="0" y="15" text-anchor="middle" font-size="10">Bush</text>
    </g>
    
    <!-- BACKGROUND objects (sky, clouds, mountains) -->
    <g transform="translate(300, 270)">
      <ellipse cx="0" cy="0" rx="30" ry="15" fill="#81d4fa" opacity="0.7"/>
      <ellipse cx="-20" cy="-10" rx="25" ry="12" fill="#81d4fa" opacity="0.7"/>
      <text x="0" y="25" text-anchor="middle" font-size="10">Clouds</text>
    </g>
    
    <g transform="translate(500, 280)">
      <polygon points="-30,0 0,-25 30,0 15,10 -15,10" fill="#80cbc4" opacity="0.7"/>
      <text x="0" y="20" text-anchor="middle" font-size="10">Mountain</text>
    </g>
    
    <!-- UI elements -->
    <g transform="translate(350, 130)">
      <rect x="-40" y="-8" width="80" height="16" fill="#ef9a9a" opacity="0.9" rx="3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10">Health: 100%</text>
    </g>
    
    <g transform="translate(450, 150)">
      <rect x="-30" y="-6" width="60" height="12" fill="#ffe0b2" opacity="0.9" rx="3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10">Score: 1200</text>
    </g>
    
    <!-- Depth indication arrows -->
    <path d="M 400 300 L 400 350" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="410" y="325" font-size="12">Depth</text>
    
    <text x="400" y="310" text-anchor="middle" font-size="10">Far</text>
    <text x="400" y="360" text-anchor="middle" font-size="10">Near</text>
    
    <!-- Legend -->
    <rect x="50" y="50" width="200" height="100" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="150" y="70" text-anchor="middle" font-weight="bold">Scene Composition</text>
    <text x="150" y="90" text-anchor="middle" font-size="11">From Camera View</text>
    <text x="150" y="110" text-anchor="middle" font-size="11">Tile-based Grid</text>
    
    <!-- Layer labels on side -->
    <text x="750" y="130" font-size="11" fill="#c62828">UI (Fixed)</text>
    <text x="750" y="280" font-size="11" fill="#01579b">BACKGROUND</text>
    <text x="750" y="330" font-size="11" fill="#2e7d32">MIDGROUND</text>
    <text x="750" y="380" font-size="11" fill="#388e3c">FOREGROUND</text>
    
    <!-- Depth scale -->
    <path d="M 700 150 L 700 450" stroke="#666" stroke-width="1"/>
    <text x="710" y="145" font-size="10">Far</text>
    <text x="710" y="460" font-size="10">Near</text>
  </g>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>

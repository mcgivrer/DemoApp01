<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Renderer Layer System</text>
    
    <!-- Renderer -->
    <rect x="350" y="60" width="100" height="50" rx="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="400" y="90" text-anchor="middle" font-weight="bold">Renderer</text>
    
    <!-- Layers -->
    <rect x="100" y="150" width="600" height="400" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    
    <!-- BACKGROUND Layer -->
    <rect x="120" y="170" width="560" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="150" y="195" text-anchor="start" font-weight="bold">BACKGROUND (zIndex: 0-99)</text>
    <text x="150" y="215" text-anchor="start" font-size="12">- Fixed position (no camera translation)</text>
    <text x="150" y="235" text-anchor="start" font-size="12">- Distant scenery, sky</text>
    
    <!-- MIDGROUND Layer -->
    <rect x="120" y="250" width="560" height="60" rx="5" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
    <text x="150" y="275" text-anchor="start" font-weight="bold">MIDGROUND (zIndex: 100-199)</text>
    <text x="150" y="295" text-anchor="start" font-size="12">- Camera translation applied</text>
    <text x="150" y="315" text-anchor="start" font-size="12">- Main game objects, player, enemies</text>
    
    <!-- FOREGROUND Layer -->
    <rect x="120" y="330" width="560" height="60" rx="5" fill="#a5d6a7" stroke="#4caf50" stroke-width="1"/>
    <text x="150" y="355" text-anchor="start" font-weight="bold">FOREGROUND (zIndex: 200-299)</text>
    <text x="150" y="375" text-anchor="start" font-size="12">- Camera translation applied</text>
    <text x="150" y="395" text-anchor="start" font-size="12">- Close objects, obstacles</text>
    
    <!-- UI Layer -->
    <rect x="120" y="410" width="560" height="60" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="1"/>
    <text x="150" y="435" text-anchor="start" font-weight="bold">UI (zIndex: 300-399)</text>
    <text x="150" y="455" text-anchor="start" font-size="12">- Fixed position (no camera translation)</text>
    <text x="150" y="475" text-anchor="start" font-size="12">- HUD, buttons, health bars</text>
    
    <!-- OVERLAY Layer -->
    <rect x="120" y="490" width="560" height="60" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
    <text x="150" y="515" text-anchor="start" font-weight="bold">OVERLAY (zIndex: 400+)</text>
    <text x="150" y="535" text-anchor="start" font-size="12">- Fixed position (no camera translation)</text>
    <text x="150" y="555" text-anchor="start" font-size="12">- Menus, special effects, dialogs</text>
    
    <!-- Camera -->
    <rect x="650" y="200" width="120" height="50" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="710" y="225" text-anchor="middle" font-weight="bold">Camera</text>
    <text x="710" y="245" text-anchor="middle" font-size="12">Follows target</text>
    
    <!-- Arrows from Renderer to Layers -->
    <path d="M 400 110 L 400 170" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Arrows from Camera to affected layers -->
    <path d="M 710 250 L 600 270" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 710 250 L 600 350" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Legend -->
    <rect x="50" y="50" width="200" height="100" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="150" y="70" text-anchor="middle" font-weight="bold">Layer Types</text>
    <rect x="70" y="85" width="15" height="15" fill="#4caf50"/>
    <text x="100" y="95">Camera Affected</text>
    <rect x="70" y="105" width="15" height="15" fill="#f44336"/>
    <text x="100" y="115">Fixed Position</text>
  </g>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>

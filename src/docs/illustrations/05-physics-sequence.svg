<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Physics Engine Sequence Diagram</text>
    
    <!-- Lifelines -->
    <line x1="100" y1="60" x2="100" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="50" text-anchor="middle" font-weight="bold">App</text>
    
    <line x1="250" y1="60" x2="250" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="250" y="50" text-anchor="middle" font-weight="bold">PhysicsEngine</text>
    
    <line x1="400" y1="60" x2="400" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="400" y="50" text-anchor="middle" font-weight="bold">Scene</text>
    
    <line x1="550" y1="60" x2="550" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="550" y="50" text-anchor="middle" font-weight="bold">Entity</text>
    
    <line x1="700" y1="60" x2="700" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="700" y="50" text-anchor="middle" font-weight="bold">Behavior</text>
    
    <!-- Messages -->
    <path d="M 100 80 L 250 80" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="175" y="75" text-anchor="middle">update(scene, deltaTime, stats)</text>
    
    <path d="M 250 120 L 250 160" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="250" y="140" text-anchor="middle">Apply Scene Behaviors</text>
    
    <path d="M 250 180 L 400 180" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="325" y="175" text-anchor="middle">getBehaviors()</text>
    
    <path d="M 400 200 L 250 200" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="325" y="195" text-anchor="middle">behavior list</text>
    
    <path d="M 250 220 L 700 220" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="475" y="215" text-anchor="middle">update(entity, deltaTime)</text>
    
    <path d="M 250 260 L 400 260" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="325" y="255" text-anchor="middle">getEntities()</text>
    
    <path d="M 400 280 L 250 280" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="325" y="275" text-anchor="middle">entity stream</text>
    
    <path d="M 250 300 L 250 340" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="250" y="320" text-anchor="middle">Filter Active Entities</text>
    
    <path d="M 250 360 L 550 360" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="400" y="355" text-anchor="middle">For Each Active Entity</text>
    
    <path d="M 550 380 L 550 420" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="550" y="400" text-anchor="middle">getBehaviors()</text>
    
    <path d="M 550 440 L 700 440" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="625" y="435" text-anchor="middle">update(entity, deltaTime)</text>
    
    <!-- Behavior Types -->
    <rect x="650" y="460" width="100" height="30" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="700" y="475" text-anchor="middle" font-size="10">GravityBehavior</text>
    
    <rect x="650" y="490" width="100" height="30" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="700" y="505" text-anchor="middle" font-size="10">VelocityBehavior</text>
    
    <rect x="650" y="520" width="100" height="30" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="700" y="535" text-anchor="middle" font-size="10">CollisionBehavior</text>
    
    <!-- Return -->
    <path d="M 700 460 L 550 460" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="625" y="455" text-anchor="middle">Updated entity</text>
    
    <path d="M 550 480 L 250 480" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="400" y="475" text-anchor="middle">Physics updated</text>
    
    <path d="M 250 500 L 100 500" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="175" y="495" text-anchor="middle">Return to App</text>
    
    <!-- Notes -->
    <rect x="50" y="520" width="200" height="60" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
    <text x="150" y="540" text-anchor="middle" font-size="11">Key Process:</text>
    <text x="150" y="560" text-anchor="middle" font-size="11">1. Apply scene behaviors</text>
    <text x="150" y="580" text-anchor="middle" font-size="11">2. Update active entities</text>
  </g>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
